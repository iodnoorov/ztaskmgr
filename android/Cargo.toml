[package]
name = "ztaskmgr-android"
description = "ztaskmgr для Android: книжка дел на Slint"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ztaskmgr-gui"
path = "src/main.rs"

[dependencies]
ztaskmgr-core = { path = "../core" }
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.android]
package = "io.github.iodnoorov.ztaskmgr"
apk_name = "ztaskmgr"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "ztaskmgr"
