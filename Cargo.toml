[package]
name = "ztaskmgr"
version = "0.7.0"
edition = "2024"
description = "Списки задач в терминале"
repository = "https://github.com/iodnoorov/ztaskmgr"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
rustls-native-certs = "0.8.5"
serde_json = "1.0.154"
unicode-width = "0.2.2"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
webpki-root-certs = "1.0.11"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
