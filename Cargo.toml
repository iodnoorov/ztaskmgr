[workspace]
members = ["core"]

[workspace.package]
version = "0.10.0"
edition = "2024"
repository = "https://github.com/iodnoorov/ztaskmgr"

[package]
name = "ztaskmgr"
description = "Списки задач в терминале"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
ztaskmgr-core = { path = "core" }
anyhow = "1.0.104"
directories = "6.0.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde_json = "1.0.154"
unicode-width = "0.2.2"

[dev-dependencies]
ztaskmgr-core = { path = "core", features = ["testing"] }
